<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Exchange App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; max-width: 400px; margin: 20px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        button { background: #4285f4; color: white; border: none; padding: 12px 20px; margin: 10px 0; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #357ae8; }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .coin-box { font-size: 22px; font-weight: bold; color: #d97706; margin: 15px 0; background: #fffbe3; padding: 10px; border-radius: 8px; border: 1px solid #fef08a; }
        input { width: 90%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Social Exchange App</h2>

        <!-- 1. लॉगिन सेक्शन -->
        <div id="auth-section">
            <button onclick="loginWithGoogle()">Google से लॉगिन करें</button>
        </div>

        <!-- 2. यूज़र डैशबोर्ड -->
        <div id="user-section" style="display:none;">
            <p style="font-size: 18px;">नमस्ते, <b id="user-name">...</b>!</p>
            <div class="coin-box">कुल कॉइन्स: <span id="coin-balance">0</span> 🪙</div>
            
            <hr>
            
            <h3>1. कॉइन कमाएं</h3>
            <p style="color: #666; font-size: 14px;">टास्क पूरा करके +5 कॉइन प्राप्त करें</p>
            <button onclick="completeTask()">टास्क पूरा किया (+5 Coin)</button>

            <hr>

            <h3>2. ऑर्डर लगाएं</h3>
            <input type="text" id="channel-link" placeholder="चैनल या वीडियो का लिंक डालें">
            <button onclick="placeOrder()" class="btn-green">ऑर्डर लगाएं (10 Coins)</button>
        </div>
    </div>

    <!-- Firebase CDN Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithRedirect, 
            getRedirectResult, 
            GoogleAuthProvider, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            increment 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // अपडेटेड और सही Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBQSzl-emocmXS9Bp4FCVnTS6NGra7ECXM",
            authDomain: "socialexchange-338ec.firebaseapp.com",
            projectId: "socialexchange-338ec",
            storageBucket: "socialexchange-338ec.firebasestorage.app",
            messagingSenderId: "478596117635",
            appId: "1:478596117635:web:30059daef46ccca05d57b6",
            measurementId: "G-W3DN7CH8SV"
        };

        // Firebase Initialization
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 1. Google Login Call
        window.loginWithGoogle = async () => {
            try {
                await signInWithRedirect(auth, provider);
            } catch (error) {
                alert("Login Initiating Error: " + error.message);
            }
        };

        // 2. Mobile Redirect Listener
        getRedirectResult(auth).catch((error) => {
            if (error.code !== "auth/popup-closed-by-user") {
                alert("Redirect Error: " + error.message);
            }
        });

        // 3. Login State Monitor & Database Auto-Sync
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-section').style.display = 'block';
                document.getElementById('user-name').innerText = user.displayName || "User";

                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            name: user.displayName || "User",
                            email: user.email,
                            coins: 0
                        });
                        document.getElementById('coin-balance').innerText = 0;
                    } else {
                        document.getElementById('coin-balance').innerText = userSnap.data().coins || 0;
                    }
                } catch (dbError) {
                    alert("Database Error: " + dbError.message);
                }
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-section').style.display = 'none';
            }
        });

        // 4. Task Complete (+5 Coins)
        window.completeTask = async () => {
            const user = auth.currentUser;
            if (!user) {
                alert("कृपया पहले लॉगिन करें!");
                return;
            }

            try {
                const userRef = doc(db, "users", user.uid);
                await updateDoc(userRef, { coins: increment(5) });
                
                const updatedSnap = await getDoc(userRef);
                document.getElementById('coin-balance').innerText = updatedSnap.data().coins;
                alert("बधाई हो! आपको 5 कॉइन मिल गए।");
            } catch (error) {
                alert("Task Error: " + error.message);
            }
        };

        // 5. Place Order (-10 Coins)
        window.placeOrder = async () => {
            const user = auth.currentUser;
            const link = document.getElementById('channel-link').value.trim();

            if (!link) {
                alert("कृपया पहले लिंक दर्ज करें!");
                return;
            }

            if (!user) {
                alert("कृपया पहले लॉगिन करें!");
                return;
            }

            try {
                const userRef = doc(db, "users", user.uid);
                await updateDoc(userRef, { coins: increment(-10) });
                
                const updatedSnap = await getDoc(userRef);
                document.getElementById('coin-balance').innerText = updatedSnap.data().coins;
                document.getElementById('channel-link').value = '';
                alert("ऑर्डर सफलतापूर्वक लग गया!");
            } catch (error) {
                alert("Order Error: " + error.message);
            }
        };
    </script>
</body>
</html>
