<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Exchange Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: #eef2f5; padding: 20px 10px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        
        .header { text-align: center; border-bottom: 2px solid #f0f0f0; padding-bottom: 15px; margin-bottom: 20px; }
        .header h2 { color: #1a73e8; font-size: 22px; }
        .balance-box { background: #e8f0fe; color: #1967d2; display: inline-block; padding: 10px 24px; border-radius: 25px; font-weight: bold; font-size: 18px; margin-top: 10px; border: 1px solid #c6dafc; }
        
        .card { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 10px; padding: 16px; margin-bottom: 20px; }
        .card h3 { font-size: 16px; color: #202124; margin-bottom: 8px; border-left: 4px solid #1a73e8; padding-left: 8px; }
        .rules { font-size: 12px; color: #5f6368; margin-bottom: 12px; line-height: 1.5; }
        
        .video-box { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; background: #000; margin-bottom: 12px; }
        .video-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 8px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-like { background: #34a853; }
        .btn-like:hover { background: #2d9247; }
        .btn-follow { background: #ff0050; }
        .btn-follow:hover { background: #e00047; }
        .btn-order { background: #1a73e8; width: 100%; font-size: 15px; padding: 12px; margin-top: 5px; }
        .btn-order:hover { background: #1557b0; }
        
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #3c4043; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dadce0; border-radius: 6px; font-size: 13px; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #1a73e8; }
        
        .msg { font-size: 13px; font-weight: bold; text-align: center; margin-top: 8px; min-height: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header & Balance -->
        <div class="header">
            <h2>Social Exchange App</h2>
            <div class="balance-box">कुल कॉइन: <span id="coinBalance">0</span> 🪙</div>
        </div>

        <!-- Task Section -->
        <div class="card">
            <h3>1. वीडियो देखें और कॉइन कमाएं</h3>
            <div class="rules">
                • 5 वीडियो लाइक = 1 कॉइन (+0.2/लाइक)<br>
                • 1 फॉलो/सब्सक्राइब = 1 कॉइन (+1.0/फॉलो)
            </div>
            
            <!-- Embedded Video Player -->
            <div class="video-box">
                <iframe id="ytVideo" src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>

            <div class="btn-group">
                <button class="btn btn-like" onclick="doLike()">लाइक किया (+0.2)</button>
                <button class="btn btn-follow" onclick="doFollow()">फॉलो किया (+1.0)</button>
            </div>
            <div class="msg" id="taskMsg"></div>
        </div>

        <!-- Order Section -->
        <div class="card">
            <h3>2. फॉलोवर / लाइक खरीदें</h3>
            
            <div class="form-group">
                <label>सर्विस चुनें:</label>
                <select id="serviceType">
                    <option value="100_subscribers">100 Subscribers / Followers (लागत: 1 कॉइन)</option>
                    <option value="20_likes">20 Likes (लागत: 1 कॉइन)</option>
                </select>
            </div>

            <div class="form-group">
                <label>अपने चैनल / वीडियो का लिंक डालें:</label>
                <input type="text" id="targetLink" placeholder="https://youtube.com/...">
            </div>

            <button class="btn btn-order" onclick="placeOrder()">ऑर्डर लगाएं (1 कॉइन)</button>
            <div class="msg" id="orderMsg"></div>
        </div>
    </div>

    <script>
        let coins = 0;

        function updateCoins() {
            // दशमलव के 1 अंक तक राउंड ऑफ करें
            document.getElementById('coinBalance').innerText = coins.toFixed(1);
        }

        function doLike() {
            coins += 0.2;
            updateCoins();
            showMsg('taskMsg', 'लाइक के लिए 0.2 कॉइन मिल गए!', 'green');
        }

        function doFollow() {
            coins += 1.0;
            updateCoins();
            showMsg('taskMsg', 'फॉलो करने के लिए 1 कॉइन मिल गया!', 'green');
        }

        function placeOrder() {
            let link = document.getElementById('targetLink').value.trim();

            if (!link) {
                showMsg('orderMsg', 'कृपया अपने प्रोफाइल/वीडियो का लिंक डालें!', 'red');
                return;
            }

            if (coins < 1) {
                showMsg('orderMsg', 'पर्याप्त कॉइन नहीं हैं! कम से कम 1 कॉइन होना चाहिए।', 'red');
                return;
            }

            coins -= 1;
            updateCoins();
            showMsg('orderMsg', 'आपका ऑर्डर सफलतापूर्वक दर्ज हो गया है!', 'green');
            document.getElementById('targetLink').value = '';
        }

        function showMsg(elementId, text, color) {
            let msgEl = document.getElementById(elementId);
            msgEl.style.color = color;
            msgEl.innerText = text;
            setTimeout(() => { msgEl.innerText = ''; }, 3500);
        }
    </script>

</body>
</html>
