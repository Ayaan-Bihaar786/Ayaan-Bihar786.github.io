<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Exchange App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; max-width: 450px; margin: 20px auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { color: #333; margin-bottom: 15px; }
        button { background: #4285f4; color: white; border: none; padding: 12px 20px; margin: 8px 0; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; width: 100%; transition: 0.3s; }
        button:hover { background: #357ae8; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-green { background: #10b981; }
        .btn-green:hover { background: #059669; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #4b5563; }
        .coin-box { font-size: 22px; font-weight: bold; color: #d97706; margin: 15px 0; background: #fffbe3; padding: 10px; border-radius: 8px; border: 1px solid #fef08a; }
        input, select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        hr { border: 0; height: 1px; background: #eee; margin: 20px 0; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 10px; background: #000; }
        .video-container iframe { position: absolute; top:0; left: 0; width: 100%; height: 100%; border: 0; }
        .rate-info { font-size: 13px; color: #2563eb; background: #eff6ff; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-weight: 500; }
        .task-link-box { background: #f3f4f6; padding: 12px; border-radius: 6px; margin-bottom: 10px; font-size: 14px; word-break: break-all; }
        .task-link-box a { color: #2563eb; font-weight: bold; text-decoration: none; font-size: 16px; }
        .timer-text { font-size: 14px; font-weight: bold; color: #dc2626; margin: 5px 0; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Social Exchange App</h2>

        <!-- 1. लॉगिन सेक्शन -->
        <div id="auth-section">
            <button onclick="loginWithGoogle()">Google से लॉगिन करें</button>
        </div>

        <!-- 2. यूज़र डैशबोर्ड -->
        <div id="user-section" style="display:none;">
            <p style="font-size: 18px; margin: 5px 0;">नमस्ते, <b id="user-name">...</b>!</p>
            <div class="coin-box">कुल कॉइन्स: <span id="coin-balance">0</span> 🪙</div>
            
            <hr>
            
            <!-- 1. स्मार्ट टाइमर टास्क सेक्शन -->
            <h3>1. कॉइन कमाएं (Watch & Follow)</h3>
            
            <div id="task-container">
                <div class="task-link-box" id="task-link-display">
                    टास्क लोड हो रहा है...
                </div>
                
                <div class="timer-text" id="timer-display" style="display:none;">
                    कृपया इंस्टाग्राम पर फॉलो करें...
                </div>

                <div class="video-container" id="player-wrapper">
                    <iframe id="youtube-player" src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>

            <button id="claim-btn" onclick="completeTask()" class="btn-green" disabled>लाइक / सब्सक्राइब / फॉलो किया (+5 Coins)</button>
            <button onclick="loadNextTask()" class="btn-secondary">अगला टास्क (Next Task) ➔</button>

            <hr>

            <!-- 2. ऑर्डर सेक्शन -->
            <h3>2. ऑर्डर लगाएं (Promote Your Link)</h3>
            
            <select id="order-type" onchange="calculateOutput()">
                <option value="subs">YouTube Subscribers / Followers (1 Coin = 1000)</option>
                <option value="likes">YouTube Likes (1 Coin = 125 Likes)</option>
                <option value="insta_followers">Instagram Followers (1 Coin = 1000)</option>
                <option value="insta_likes">Instagram Likes (1 Coin = 125)</option>
                <option value="fb_likes">Facebook Page Likes (1 Coin = 1000)</option>
            </select>

            <input type="text" id="channel-link" placeholder="चैनल / पोस्ट / प्रोफाइल का लिंक डालें">
            <input type="number" id="coin-amount" placeholder="कितने कॉइन्स खर्च करना चाहते हैं?" min="1" oninput="calculateOutput()">
            
            <div class="rate-info" id="calculation-result">
                अनुमानित लाभ: 0
            </div>

            <button onclick="placeOrder()" class="btn-green">ऑर्डर लगाएं</button>
        </div>
    </div>

    <!-- Firebase CDN Module -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc, 
            updateDoc, 
            collection,
            addDoc,
            getDocs,
            query,
            limit,
            increment 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQSzl-emocmXS9Bp4FCVnTS6NGra7ECXM",
            authDomain: "socialexchange-338ec.firebaseapp.com",
            projectId: "socialexchange-338ec",
            storageBucket: "socialexchange-338ec.firebasestorage.app",
            messagingSenderId: "478596117635",
            appId: "1:478596117635:web:30059daef46ccca05d57b6",
            measurementId: "G-W3DN7CH8SV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // आपका डिफ़ॉल्ट Instagram लिंक
        const defaultAdminTasks = [
            {
                link: "https://www.instagram.com/ayaan_raj_786?igsi=OTE1NHNxdDVleGsx",
                orderType: "insta_followers",
                coinsSpent: 1000
            }
        ];

        let activeOrders = [];
        let currentTaskIndex = 0;
        let isTaskOpened = false;
        let timerInterval = null;

        // 1. Google Login (Popup)
        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert("Login Error: " + error.message);
            }
        };

        // 2. Auth State Sync & Task Fetch
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('user-section').style.display = 'block';
                document.getElementById('user-name').innerText = user.displayName || "User";

                try {
                    const userRef = doc(db, "users", user.uid);
                    const userSnap = await getDoc(userRef);

                    if (!userSnap.exists()) {
                        await setDoc(userRef, {
                            name: user.displayName || "User",
                            email: user.email,
                            coins: 0
                        });
                        document.getElementById('coin-balance').innerText = 0;
                    } else {
                        document.getElementById('coin-balance').innerText = userSnap.data().coins || 0;
                    }

                    await fetchTasks();
                } catch (dbError) {
                    alert("Database Error: " + dbError.message);
                }
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('user-section').style.display = 'none';
            }
        });

        // 3. ऑर्डर्स लोड करना (अगर कोई ऑर्डर नहीं होगा तो आपका Instagram लिंक दिखेगा)
        async function fetchTasks() {
            try {
                const q = query(collection(db, "orders"), limit(20));
                const querySnapshot = await getDocs(q);
                activeOrders = [];

                querySnapshot.forEach((docSnap) => {
                    activeOrders.push(docSnap.data());
                });

                if (activeOrders.length === 0) {
                    activeOrders = [...defaultAdminTasks];
                }

                currentTaskIndex = 0;
                displayCurrentTask();
            } catch (error) {
                console.error("Fetch Tasks Error:", error);
                activeOrders = [...defaultAdminTasks];
                displayCurrentTask();
            }
        }

        // 4. टास्क डिस्प्ले करना
        function displayCurrentTask() {
            if (activeOrders.length === 0) return;

            resetTimer();
            const task = activeOrders[currentTaskIndex];
            const displayBox = document.getElementById('task-link-display');
            const playerWrapper = document.getElementById('player-wrapper');

            displayBox.innerHTML = `👉 <a href="${task.link}" target="_blank" onclick="startSmartTimer()">यहाँ क्लिक करके इंस्टाग्राम पर फॉलो करें</a><br><small>(${getTaskLabel(task.orderType)})</small>`;

            const youtubeId = extractVideoID(task.link);
            if (youtubeId && (task.orderType === 'subs' || task.orderType === 'likes')) {
                playerWrapper.style.display = 'block';
                document.getElementById('youtube-player').src = `https://www.youtube-nocookie.com/embed/${youtubeId}`;
            } else {
                playerWrapper.style.display = 'none';
            }
        }

        function getTaskLabel(type) {
            if (type === 'subs') return 'YouTube Subscribe';
            if (type === 'likes') return 'YouTube Like';
            if (type === 'insta_followers') return 'Instagram Follow';
            if (type === 'insta_likes') return 'Instagram Like';
            if (type === 'fb_likes') return 'Facebook Like';
            return 'Social Task';
        }

        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // 5. स्मार्ट टाइमर
        window.startSmartTimer = () => {
            isTaskOpened = true;
            let timeLeft = 20;
            const timerDisplay = document.getElementById('timer-display');
            const claimBtn = document.getElementById('claim-btn');

            timerDisplay.style.display = 'block';
            claimBtn.disabled = true;

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = `कृपया इंस्टाग्राम पर फॉलो करें। सत्यापन में समय शेष: ${timeLeft}s`;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "सत्यापन पूर्ण! अब बटन दबाकर कॉइन प्राप्त करें।";
                    claimBtn.disabled = false;
                }
            }, 1000);
        };

        function resetTimer() {
            isTaskOpened = false;
            clearInterval(timerInterval);
            document.getElementById('timer-display').style.display = 'none';
            document.getElementById('claim-btn').disabled = true;
        }

        // 6. अगला टास्क
        window.loadNextTask = () => {
            if (activeOrders.length === 0) return;
            currentTaskIndex = (currentTaskIndex + 1) % activeOrders.length;
            displayCurrentTask();
        };

        // 7. कॉइन क्लेम करना
        window.completeTask = async () => {
            const user = auth.currentUser;
            if (!user) return alert("कृपया पहले लॉगिन करें!");

            if (!isTaskOpened) {
                return alert("Task Failed! पहले दिए गए लिंक पर क्लिक करके फॉलो/सब्सक्राइब करें।");
            }

            try {
                const userRef = doc(db, "users", user.uid);
                await updateDoc(userRef, { coins: increment(5) });
                
                const updatedSnap = await getDoc(userRef);
                document.getElementById('coin-balance').innerText = updatedSnap.data().coins;
                alert("सत्यापन सफल! +5 कॉइन्स आपके खाते में जुड़ गए।");
                
                window.loadNextTask();
            } catch (error) {
                alert("Task Error: " + error.message);
            }
        };

        // 8. रेट कैलकुलेटर
        window.calculateOutput = () => {
            const type = document.getElementById('order-type').value;
            const coins = parseInt(document.getElementById('coin-amount').value) || 0;
            const resultDiv = document.getElementById('calculation-result');

            if (type === 'subs' || type === 'insta_followers' || type === 'fb_likes') {
                const count = coins * 1000;
                resultDiv.innerText = `अनुमानित लाभ: ${count} Followers / Likes`;
            } else {
                const count = coins * 125;
                resultDiv.innerText = `अनुमानित लाभ: ${count} Likes`;
            }
        };

        // 9. ऑर्डर प्लेस करना
        window.placeOrder = async () => {
            const user = auth.currentUser;
            const link = document.getElementById('channel-link').value.trim();
            const coinsToSpend = parseInt(document.getElementById('coin-amount').value);
            const orderType = document.getElementById('order-type').value;

            if (!link) return alert("कृपया सही लिंक दर्ज करें!");
            if (!coinsToSpend || coinsToSpend <= 0) return alert("कृपया कॉइन्स दर्ज करें!");
            if (!user) return alert("कृपया लॉगिन करें!");

            try {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);
                const currentCoins = userSnap.data().coins || 0;

                if (currentCoins < coinsToSpend) {
                    return alert("पर्याप्त कॉइन्स नहीं हैं! पहले कॉइन्स कमाएं।");
                }

                await updateDoc(userRef, { coins: increment(-coinsToSpend) });

                const mult = (orderType === 'subs' || orderType === 'insta_followers' || orderType === 'fb_likes') ? 1000 : 125;
                const quantity = coinsToSpend * mult;

                await addDoc(collection(db, "orders"), {
                    userId: user.uid,
                    userEmail: user.email,
                    link: link,
                    orderType: orderType,
                    coinsSpent: coinsToSpend,
                    quantity: quantity,
                    createdAt: new Date()
                });

                document.getElementById('coin-balance').innerText = currentCoins - coinsToSpend;
                document.getElementById('channel-link').value = '';
                document.getElementById('coin-amount').value = '';
                window.calculateOutput();

                alert("ऑर्डर लग गया! आपका लिंक अब लाइव टास्क में जोड़ दिया गया है।");
                await fetchTasks();
            } catch (error) {
                alert("Order Error: " + error.message);
            }
        };
    </script>
</body>
</html>
