<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayaan-Bihar786 - P2P Social Media Growth</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        button { background: #4285F4; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #357ae8; }
        .hidden { display: none; }
        #userInfo { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ayaan-Bihar786 Platform</h2>
        <p>P2P Social Media Growth & Coins Exchange</p>
        
        <!-- Login Button -->
        <div id="loginSection">
            <button id="loginBtn">Google से लॉगिन करें</button>
        </div>

        <!-- User Dashboard -->
        <div id="dashboardSection" class="hidden">
            <div id="userInfo"></div>
            <p>मुफ्त टास्क लिमिट: <span id="taskCount">0</span>/2 उपयोग किए गए</p>
            <p>कॉइन्स: <span id="userCoins">0</span> (₹10 = 1 Coin = 250 Units)</p>
            <button id="taskBtn">फ्री टास्क पूरा करें</button>
            <br>
            <hr style="margin: 20px 0;">
            <p>एडमिन से संपर्क करें:</p>
            <a href="https://instagram.com/ayaan_raj_786" target="_blank" style="color: #E1306C; font-weight: bold; text-decoration: none;">Instagram पर आएं (ayaan_raj_786)</a>
        </div>
    </div>

    <!-- Firebase SDKs (v9.22.2) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

        // Your web app's Firebase configuration (Corrected & Verified)
        const firebaseConfig = {
          apiKey: "AIzaSyBQSzl-emocmXS9Bp4FCVnTS6NGra7ECXM",
          authDomain: "socialexchange-338ec.firebaseapp.com",
          projectId: "socialexchange-338ec",
          storageBucket: "socialexchange-338ec.firebasestorage.app",
          messagingSenderId: "478596117635",
          appId: "1:478596117635:web:30059daef46ccca05d57b6",
          measurementId: "G-W3DN7CH8SV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('loginBtn');
        const loginSection = document.getElementById('loginSection');
        const dashboardSection = document.getElementById('dashboardSection');
        const userInfo = document.getElementById('userInfo');
        const taskCountElem = document.getElementById('taskCount');
        const userCoinsElem = document.getElementById('userCoins');
        const taskBtn = document.getElementById('taskBtn');

        // Google Login Handler
        loginBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
            .then((result) => {
                console.log("Login Success:", result.user.email);
            })
            .catch((error) => {
                console.error("Login Error:", error.message);
                alert("लॉगिन विफल रहा: " + error.message);
            });
        });

        // Track Auth State & User Data in Firestore
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
                userInfo.innerText = `स्वागत है, ${user.displayName || user.email}`;

                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    // Create new user profile with 2 free limits
                    await setDoc(userRef, {
                        email: user.email,
                        tasksUsed: 0,
                        coins: 0
                    });
                    taskCountElem.innerText = 0;
                    userCoinsElem.innerText = 0;
                } else {
                    const data = userSnap.data();
                    taskCountElem.innerText = data.tasksUsed || 0;
                    userCoinsElem.innerText = data.coins || 0;
                }

                // Task Button Click Logic (2-Task Free Limit)
                taskBtn.onclick = async () => {
                    const currentSnap = await getDoc(userRef);
                    const currentData = currentSnap.data();
                    const currentTasks = currentData.tasksUsed || 0;

                    if (currentTasks >= 2) {
                        alert("आपकी 2-टास्क की मुफ्त सीमा समाप्त हो चुकी है! कॉइन्स खरीदने के लिए एडमिन से संपर्क करें।");
                        return;
                    }

                    // Increment task count
                    await updateDoc(userRef, {
                        tasksUsed: increment(1)
                    });

                    taskCountElem.innerText = currentTasks + 1;
                    alert("सफलतापूर्वक टास्क पूरा हो गया!");
                };

            } else {
                loginSection.classList.remove('hidden');
                dashboardSection.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
